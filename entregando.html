<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregando su Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ff6347;
      --secondary-color: #f0e68c;
      --text-color: #333;
      --background-gradient: linear-gradient(135deg, #6a11cb, #2575fc);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--background-gradient);
      color: var(--text-color);
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 100%;
      max-width: 400px; /* Se adapta según el tamaño de pantalla */
      height: auto;
      margin-bottom: 30px;
      animation: fadeIn 1.5s ease-in-out;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      font-weight: 600;
      color: var(--text-color);
      animation: slideIn 1s ease-out;
    }
    p {
      font-size: 18px;
      max-width: 600px;
      line-height: 1.5;
      color: #f7f7f7;
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    /* Ajustes responsivos adicionales para pantallas pequeñas */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }
      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <img src="images/logo.jpg" alt="Logo de Mi Tienda" class="logo">
  <h1>Estamos entregando su cuenta...</h1>
  <p>
    Estimado cliente, en 5 minutos le llegará su producto a la información brindada. 
    Contáctate al +593969468578, nombre: Roxon Nazareno.
  </p>
</body>
</html>
